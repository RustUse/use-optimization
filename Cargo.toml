[workspace]
members = [
    "crates/use-optimization",
    "crates/use-objective",
    "crates/use-optimization-constraint",
    "crates/use-search-space",
    "crates/use-score",
    "crates/use-loss",
    "crates/use-grid-search",
    "crates/use-local-search",
]
resolver = "2"

[workspace.package]
authors = ["RustUse Contributors"]
edition = "2024"
homepage = "https://rustuse.org"
license = "MIT OR Apache-2.0"
publish = false
readme = "README.md"
repository = "https://github.com/RustUse/use-optimization"
rust-version = "1.95.0"
version = "0.0.2"

[workspace.dependencies]
use-optimization-constraint = { version = "0.0.2", path = "crates/use-optimization-constraint" }
use-grid-search = { version = "0.0.2", path = "crates/use-grid-search" }
use-local-search = { version = "0.0.2", path = "crates/use-local-search" }
use-loss = { version = "0.0.2", path = "crates/use-loss" }
use-objective = { version = "0.0.2", path = "crates/use-objective" }
use-optimization = { version = "0.0.2", path = "crates/use-optimization" }
use-score = { version = "0.0.2", path = "crates/use-score" }
use-search-space = { version = "0.0.2", path = "crates/use-search-space" }

[workspace.metadata.rustuse.release]
publish = false
versioning = "lockstep-0.x"
first-publish-candidates = [
    "use-objective",
    "use-optimization-constraint",
    "use-search-space",
    "use-score",
    "use-loss",
    "use-grid-search",
    "use-local-search",
    "use-optimization",
]

[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
expect_used = "warn"
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
